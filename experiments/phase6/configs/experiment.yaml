experiment:
  id: "exp_phase6_generalization_v1"
  phase: 6
  protocol_version: "phase6-protocol-v1.0.0"
  description: "Phase 6 Generalization Research: Investigating structural legitimate deep-link augmentation on domain generalization without degrading phishing detection."

invariants:
  frozen_random_forest_sha256: "95f09ddc7bda88bad29cf8329a5ee83f74079da24d4e916427e95524d02f39bb"
  phase4_external_benchmark_sha256: "88525183abd402e385c6329c49b8d551db86b22bcf03d8429de37d477c8312c3"
  phiusiil_source_dataset_sha256: "a236549cd369cd80bd478ff8e1779cbf44c58d5c3f79f7a51a1adbed7d06d1c6"
  phase5_approved_pilot_corpus_sha256: "cca9ef3f8b265c4c3b0395c94fc1c4c40442f90a5381713e33511ccc30fe89cb"
  phase5_pilot_review_queue_sha256: "e4ea2a206f477eb9902378ef599d80024395a09bd9cc2dd6dc527d14b05da360"

artifacts:
  frozen_model_path: "models/random_forest_model.joblib"
  phase4_benchmark_path: "data/external/external_validation_benchmark.csv"
  phiusiil_dataset_path: "data/PhiUSIIL_Phishing_URL_Dataset.csv"
  phase5_pilot_approved_path: "experiments/generalization/datasets/approved_pilot_corpus.csv"
  phase5_pilot_queue_path: "experiments/generalization/datasets/pilot_review_queue.csv"
  candidate_models_dir: "models/phase6_candidates"

feature_extraction:
  version: "1.0.0"
  module: "src.features"
  num_features: 18
  feature_names:
    - "URLLength"
    - "DomainLength"
    - "IsDomainIP"
    - "TLDLength"
    - "NoOfSubDomain"
    - "HasObfuscation"
    - "NoOfObfuscatedChar"
    - "ObfuscationRatio"
    - "NoOfLettersInURL"
    - "LetterRatioInURL"
    - "NoOfDegitsInURL"
    - "DegitRatioInURL"
    - "NoOfEqualsInURL"
    - "NoOfQMarkInURL"
    - "NoOfAmpersandInURL"
    - "NoOfOtherSpecialCharsInURL"
    - "SpacialCharRatioInURL"
    - "IsHTTPS"

label_mapping:
  0: "Phishing"
  1: "Legitimate"

random_seeds:
  global: 42
  data_split: 42
  model_training: 42
  bootstrap: 42

group_splitting:
  group_key: "registered_domain"
  ratios:
    train: 0.70
    val: 0.15
    internal_test: 0.15
  zero_domain_leakage: true
  deduplicate_exact_urls: true

models:
  E0:
    name: "Frozen Random Forest (Control)"
    family: "RandomForestClassifier"
    training_data: "Original PhiUSIIL (Frozen, non-retrained)"
    retrained: false
    artifact_path: "models/random_forest_model.joblib"
  E1:
    name: "Random Forest with Validated Benign Augmentation"
    family: "RandomForestClassifier"
    training_data: "PhiUSIIL train partition + Validated Phase 6 benign corpus"
    retrained: true
    hyperparameters:
      n_estimators: 100
      random_state: 42
      n_jobs: -1
    artifact_path: "models/phase6_candidates/rf_augmented.joblib"
  E2:
    name: "XGBoost with Validated Benign Augmentation"
    family: "XGBClassifier"
    training_data: "PhiUSIIL train partition + Validated Phase 6 benign corpus"
    retrained: true
    hyperparameters:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      eval_metric: "logloss"
      random_state: 42
      n_jobs: -1
    artifact_path: "models/phase6_candidates/xgboost_augmented.joblib"
  E3:
    name: "Logistic Regression with Validated Benign Augmentation"
    family: "LogisticRegression"
    training_data: "PhiUSIIL train partition + Validated Phase 6 benign corpus"
    retrained: true
    hyperparameters:
      C: 1.0
      max_iter: 1000
      random_state: 42
    scaler: "StandardScaler"
    artifact_path: "models/phase6_candidates/logistic_regression_augmented.joblib"

threshold_policy:
  primary_threshold: 0.50
  tune_on: "validation"
  tuning_metric: "macro_f1"
  never_tune_on:
    - "data/external/external_validation_benchmark.csv"
    - "internal_test"

metrics:
  classification:
    - "accuracy"
    - "legitimate_recall"
    - "legitimate_fpr"
    - "phishing_recall"
    - "phishing_precision"
    - "macro_f1"
    - "roc_auc"
    - "pr_auc"
  probability_quality:
    - "brier_score"
    - "ece"

subgroup_strata:
  - "homepage"
  - "single_level_path"
  - "multi_level_path"
  - "trailing_slash"
  - "query_bearing"
  - "fragment_bearing"
  - "subdomain_bearing"
  - "high_special_char"
  - "short_url"
  - "long_url"
