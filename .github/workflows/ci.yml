name: CI

on:
  push:
    branches: [ main, phase-2-testing-reliability ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Verify Git formatting and whitespace
        run: git diff --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite via pytest
        run: |
          export MPLCONFIGDIR=/tmp/mpl
          PYTHONPATH=. pytest -v

      - name: Run test suite via unittest
        run: |
          export MPLCONFIGDIR=/tmp/mpl
          PYTHONPATH=. python -m unittest discover tests -v

      - name: Verify CLI threat scan execution
        run: |
          PYTHONPATH=. python src/cli.py "https://www.google.com"
          PYTHONPATH=. python src/cli.py "http://198.98.58.123/"
